spark.jars.packages                              org.apache.iceberg:iceberg-spark-runtime-3.5_2.12:1.9.2,org.apache.iceberg:iceberg-aws-bundle:1.9.2
spark.sql.extensions                             org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.defaultCatalog                         s3tables
spark.sql.catalog.s3tables                       org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.s3tables.type                  rest
spark.sql.catalog.s3tables.uri                   https://glue.eu-west-2.amazonaws.com/iceberg
spark.sql.catalog.s3tables.warehouse             account_id:s3tablescatalog/nyc-taxi-iceberg-bucket #replace your aws account id
spark.sql.catalog.s3tables.rest.signing-name     glue
spark.sql.catalog.s3tables.rest.signing-region   eu-west-2
spark.sql.catalog.s3tables.io-impl               org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.s3tables.rest-metrics-reporting-enabled  false
spark.sql.session.timeZone                       America/New_York
spark.driver.memory                              4g
spark.executor.memory                            4g
spark.sql.catalog.s3tables.client.region          eu-west-2
